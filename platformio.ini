; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Kecepatan komunikasi Serial Monitor (wajib sama dengan Serial.begin)
monitor_speed = 115200

; Kecepatan upload firmware ke NodeMCU
upload_speed = 921600

; MQTT client (raw TCP/TLS via WiFiClientSecure — di broker dipakai port 8883/mqtts)
lib_deps = knolleary/PubSubClient @ ^2.8

; Agar folder lib/ bisa membaca file header di folder include/
build_flags = -Iinclude